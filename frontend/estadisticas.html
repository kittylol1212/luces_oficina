<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Estadísticas - Consumo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/estadisticas.css">
</head>
<body>

    <div class="container-stats">
        <a href="pisos.html" class="btn-volver">⬅ Volver al Mapa</a>
        
        <header>
            <h1>📊 Reporte de Uso de Iluminación</h1>
            <p>Monitoreo de horas acumuladas y tendencias de consumo.</p>
        </header>

        <div class="card card-tabla">
            <details class="panel-desplegable">
                
                <summary class="encabezado-desplegable">
                    <div class="header-col">ID Luz</div>
                    <div class="header-col">Horas Totales</div>
                    <div class="header-col">Nivel de Uso (24h) <span class="icono-flecha">▼</span></div>
                </summary>

                <div class="contenido-desplegable">
                    <table class="tabla-stats">
                        <tbody id="cuerpo-tabla">
                            </tbody>
                    </table>
                </div>

            </details>
        </div>

        <div class="card chart-container">
            <h3>📈 Consumo Histórico (Últimos días)</h3>
            <canvas id="canvasGrafico"></canvas>
        </div>
    </div>

    <script src="js/stats_logic.js"></script>
</body>
</html>
